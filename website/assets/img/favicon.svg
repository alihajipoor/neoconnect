<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neoxify">
  <!-- The Neoxify mark: a broken ring around a solid centre, echoing the
       circular Connect control in the desktop app.

       Unlike the in-page logo, which sits on transparency, the favicon keeps
       a dark rounded-square plate behind it. A thin gradient ring on a
       transparent background disappears against a light browser tab strip;
       the plate guarantees contrast wherever the tab is drawn. -->
  <defs>
    <linearGradient id="nx-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0a0a10"/>
  <!-- r=17 -> circumference ~107, so 78 on / 29 off is one stroke and one
       gap. Tightened from the in-page mark's r=21 to leave room for the
       plate's padding. -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#nx-mark)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="78 29"
          transform="rotate(-58 32 32)"/>
  <circle cx="32" cy="32" r="6.5" fill="url(#nx-mark)"/>
</svg>
