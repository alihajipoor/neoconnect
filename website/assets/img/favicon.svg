<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neoxify">
  <!-- Same lightning mark and violet-to-cyan gradient as the admin panel's
       logo (apps/panel/src/components/brand/logo.tsx), so a browser tab for
       the site and a tab for the panel are recognisably the same product. -->
  <defs>
    <linearGradient id="nx-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#nx-mark)"/>
  <polygon points="35 9 15 37 30 37 27 55 49 27 34 27" fill="#ffffff"/>
</svg>
