<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="Neoxify">
  <!-- Google Play's feature graphic. Exactly 1024x500, which Play
       requires and rejects rather than rescales.

       Two constraints shaped this. Play crops and overlays this image in
       several places, so nothing that matters sits near an edge — the
       lockup is centred with wide margins. And it is shown at roughly
       thumbnail size in search, so it carries the mark, the name and one
       short line, not a feature list nobody could read.

       No claim about defeating censorship anywhere in it: store listings
       are reviewed, and a VPN promising to beat filtering is the kind of
       line that attracts the wrong attention. -->
  <defs>
    <linearGradient id="fg-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fg-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="fg-glow-a" cx="0.22" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fg-glow-b" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="#0b0b12"/>
  <rect width="1024" height="500" fill="url(#fg-glow-a)"/>
  <rect width="1024" height="500" fill="url(#fg-glow-b)"/>

  <!-- Mark, 160px, vertically centred -->
  <g transform="translate(232 170) scale(2.5)">
    <circle cx="32" cy="32" r="21" stroke="url(#fg-brand)" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="96 36"
            transform="rotate(-58 32 32)"/>
    <circle cx="32" cy="32" r="8" fill="url(#fg-brand)"/>
  </g>

  <!-- Wordmark and strapline. System font stack rather than a webfont:
       an SVG rasterised elsewhere cannot fetch a font, and a missing one
       would silently fall back and change the whole layout. -->
  <text x="430" y="248"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="86" font-weight="700" fill="url(#fg-text)"
        letter-spacing="-1">Neoxify</text>
  <text x="434" y="296"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="27" font-weight="500" fill="#9ca3b8">Fast, private VPN — five protocols, one tap</text>
</svg>
