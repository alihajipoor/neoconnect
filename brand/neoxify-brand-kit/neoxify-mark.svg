<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Neoxify">
  <!-- The Neoxify mark on transparency: a broken ring around a solid
       centre, echoing the circular Connect control in the app.

       Extracted from nx_logo_mark() in website/inc/partials/icons.php so
       the brand kit and the live site cannot drift apart. If the mark
       changes there, regenerate this.

       r=21 gives a circumference of ~132, so 96 on / 36 off is exactly
       one stroke and one gap — change the radius and the dasharray must
       change with it or the gap multiplies. -->
  <defs>
    <linearGradient id="nx-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="21" stroke="url(#nx-brand)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="96 36"
          transform="rotate(-58 32 32)"/>
  <circle cx="32" cy="32" r="8" fill="url(#nx-brand)"/>
</svg>
