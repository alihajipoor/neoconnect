# Neoxify Xray fallback + API mirror (germany-2 parity; panel origin by IP, Host/SNI origin.example.net, public resolvers, proxy_buffering off).
server {
    listen 127.0.0.1:8080 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name _;
    root /var/www/neoxify-fallback;
    index index.html;
    server_tokens off;
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $neoxify_panel 203.0.113.5;
        proxy_pass https://$neoxify_panel$request_uri;
        proxy_set_header Host origin.example.net;
        proxy_ssl_name origin.example.net;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
server {
    listen 127.0.0.1:8081 proxy_protocol;
    http2 on;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
