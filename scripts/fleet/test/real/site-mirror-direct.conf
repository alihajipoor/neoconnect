# Neoxify direct API mirror on 2096 (nginx terminates TLS itself; own cert lineage).
server {
    listen 2096 ssl;
    http2 on;
    server_name def456.example.org;
    ssl_certificate /etc/letsencrypt/live/def456.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/def456.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:neoxify_mirror_direct:1m;
    server_tokens off;
    root /var/www/neoxify-fallback;
    index index.html;
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $neoxify_panel 203.0.113.5;
        proxy_pass https://$neoxify_panel$request_uri;
        proxy_set_header Host origin.example.net;
        proxy_ssl_name origin.example.net;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
