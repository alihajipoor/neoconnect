[package]
name = "neoconnect-desktop"
version = "0.9.47"
description = "NeoConnect VPN client"
authors = ["NeoConnect"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"
# Background update checks. Windows only for now -- the plugin is
# desktop-wide, but this crate only ever builds for Windows.
tauri-plugin-updater = "2"
# The updater needs the app to be able to restart itself after
# staging an install; process::restart lives here.
tauri-plugin-process = "2"
neoconnect-ipc = { path = "../ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
# The control-plane probe's TLS handshake (src/control_plane_probe.rs).
# Both already in the tree through tauri-plugin-http's reqwest, at the
# versions in Cargo.lock; named here so the probe can use them. ring and
# not the default aws-lc-rs, which the tree does not otherwise build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The egress check's `/health/ip`, asked over IPv4 only (src/health_ip.rs).
# Already in the tree through tauri-plugin-http, with the same TLS feature
# that crate enables, so this names it rather than adding anything.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The relay of last resort (src/relay_http.rs): its certificate is
# accepted by SPKI pin, read with the same parser rustls verifies the
# handshake signature with (webpki), hashed with ring, and the pins are
# base64. Its gzip bodies are inflated with flate2. Every one of these is
# already in Cargo.lock at the version and features named here, through
# rustls, reqwest and the icon decoders, so this adds no crate to the
# build.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
ring = "0.17"
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
# relay_http.rs's HTTP/2 test serves h2 over TLS on loopback. All four are
# already in Cargo.lock under hyper and reqwest; tokio-rustls without its
# default features, which would bring aws-lc-rs.
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false }
http = "1"
bytes = "1"

[dependencies.windows-sys]
version = "0.59"
# IpHelper brings IcmpSendEcho, which is how latency is measured for the
# UDP protocols. It needs no elevation, unlike a raw socket.
features = [
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Foundation",
  # MIB_IPFORWARDROW, which GetBestRoute fills in -- see
  # vpn.rs::network_fingerprint.
  "Win32_Networking_WinSock",
  # EnumWindows: which processes own a window the customer can
  # see. Only answerable here -- the helper service is in
  # session 0 and cannot see the interactive desktop at all.
  "Win32_UI_WindowsAndMessaging",
]

