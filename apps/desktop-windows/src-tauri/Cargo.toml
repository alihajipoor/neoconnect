[package]
name = "neoconnect-desktop"
version = "0.5.1"
description = "NeoConnect VPN client"
authors = ["NeoConnect"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"
neoconnect-ipc = { path = "../ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[dependencies.windows-sys]
version = "0.59"
# IpHelper brings IcmpSendEcho, which is how latency is measured for the
# UDP protocols. It needs no elevation, unlike a raw socket.
features = [
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Foundation",
  # MIB_IPFORWARDROW, which GetBestRoute fills in -- see
  # vpn.rs::network_fingerprint.
  "Win32_Networking_WinSock",
]

