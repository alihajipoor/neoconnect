[package]
name = "neoconnect-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neoconnect-service"
path = "src/main.rs"

[dependencies]
neoconnect-ipc = { path = "../ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
windows-service = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    # Adapter enumeration for routing -- see src/adapters.rs for why this
    # is done through the API rather than by parsing localised command output.
    "Win32_NetworkManagement_IpHelper",
    # IP_ADAPTER_ADDRESSES_LH is gated behind Ndis as well as WinSock.
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
]
