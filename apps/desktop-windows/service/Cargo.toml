[package]
name = "neoconnect-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neoconnect-service"
path = "src/main.rs"

[dependencies]
neoconnect-ipc = { path = "../ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
windows-service = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
# Custom (per-app split tunnel) mode. Raw FFI rather than the higher-level
# `windivert` wrapper, which upstream still describes as work in progress
# -- the packet rewriting here needs exact control over the address
# structure, which is precisely what a wrapper abstracts away.
windivert-sys = "0.9"
# `windivert-sys` exposes its handles as this crate's HANDLE, so the
# version has to match the one it was built against rather than the
# windows-sys used everywhere else in this crate.
windows = { version = "0.43", features = ["Win32_Foundation"] }
# IP_UNICAST_IF has to be set on a socket before it connects, which rules
# out std's TcpStream::connect. socket2 is the standard way to build a
# socket, configure it, and only then hand it to std.
socket2 = { version = "0.5", features = ["all"] }
# The NRPT cleanup fallback in engines/dns.rs. Removing our DNS rule via
# PowerShell needs a working PowerShell, and the whole point of that
# fallback is the machine where nothing works any more -- so the rule is
# deleted straight out of the registry instead. Already in the lockfile
# (embed-resource pulls the same version), so this adds no new code to
# the tree.
winreg = "0.55"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    # Process enumeration for the Custom-mode app picker, so a customer
    # can choose from what is running instead of hunting through
    # Program Files for an executable.
    "Win32_System_Diagnostics_ToolHelp",
    # EnumWindows and friends: the picker asks "does this process
    # own a window a person can see", which is the only reliable
    # difference between an application and a background helper.
    "Win32_UI_WindowsAndMessaging",
    # SHGetFileInfoW: the icon Windows already draws for an exe,
    # so the picker shows what the taskbar shows.
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    # Adapter enumeration for routing -- see src/adapters.rs for why this
    # is done through the API rather than by parsing localised command output.
    "Win32_NetworkManagement_IpHelper",
    # RasDialW and its structures, for the IKEv2 engine.
    #
    # These were hand-declared originally, on the reasoning that one
    # function did not justify the dependency. That cost three wrong
    # struct layouts in a row -- 2128 vs 2120 for RASDIALPARAMSW, then 48
    # and 64 vs 72 for RASDIALEXTENSIONS -- each of which Windows
    # reported as the same undifferentiated error 632, and one of which
    # dialled successfully and then killed the service from inside
    # RASAPI32. The generated bindings cannot get the layout wrong, and
    # the dependency was already here.
    "Win32_NetworkManagement_Rras",
    # IP_ADAPTER_ADDRESSES_LH is gated behind Ndis as well as WinSock.
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
]
