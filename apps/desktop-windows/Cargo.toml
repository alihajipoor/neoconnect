# Workspace root for the three Rust crates that make up the Windows
# client. `src-tauri` is the app the user actually sees; `service` is the
# privileged helper it drives; `ipc` is the wire contract between them,
# shared so the two can never drift out of sync.
[workspace]
resolver = "2"
members = ["src-tauri", "service", "ipc"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
