# Workspace root for the four Rust crates that make up the Windows
# client. `src-tauri` is the app the user actually sees; `service` is the
# privileged helper it drives; `ipc` is the wire contract between them,
# shared so the two can never drift out of sync; `bootstrapper` is the
# file a customer downloads, which draws the install window and runs the
# real installer inside it.
[workspace]
resolver = "2"
members = ["src-tauri", "service", "ipc", "bootstrapper"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
