<!doctype html>
<html lang="en" class="dark" data-surface="auth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Your account — Neoxify</title>
    <meta name="description" content="Sign in to your Neoxify account to manage your subscription, buy a plan, redeem a voucher or get support." />
    <!-- An account area has nothing to gain from being indexed, and the
         sign-in form has something to lose from it. Its links back to the
         site's pages may still be followed. robots.txt must let crawlers
         fetch this page, or they never see this line and index the bare
         URL from the site's many links to it. -->
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <!-- The Latin text face, so the card is drawn once, in its own face.
         The build moves this, the app script and its stylesheet into a
         loader that asks for them just after the first paint
         (portal-html.ts). The Persian face is not preloaded: most visits
         never need it. -->
    <link rel="preload" href="./src/auth/assets/Inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- The sign-in screens' canvas and dotted world map (src/auth/scene.css,
         inlined into the head at build).
         Plain markup, so it paints before any script has run; the app turns
         it off for the account screens. Natural Earth via world-atlas (ISC):
         /account/licenses/. -->
    <div class="pa-scene" aria-hidden="true">
      <picture>
        <source srcset="./src/auth/assets/world-map-dark.svg" media="(prefers-color-scheme: dark)" />
        <img class="pa-map" src="./src/auth/assets/world-map-light.svg" alt="" width="1600" height="656" fetchpriority="high" />
      </picture>
    </div>
    <div id="root"></div>
    <noscript>
      <div class="pa-noscript">
        <h1>JavaScript is required here</h1>
        <p>
          The account area needs JavaScript. The rest of the site works without it —
          <a href="/">go back to neoxify.net</a>, or email
          <a href="mailto:support@neoxify.com">support@neoxify.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
