[package]
name = "neoconnect-macos"
version = "0.1.0"
description = "Neoxify VPN client for macOS"
authors = ["Neoxify"]
edition = "2021"

[lib]
name = "desktop_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
# Background update checks, pointed at the API rather than at GitHub --
# see apps/backend/src/modules/updates. The Mac build is distributed
# with Developer ID outside the App Store, so it updates itself the same
# way the Windows one does; an App Store build would have to drop this,
# since Apple forbids an app shipping its own updater.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Matches the Windows profile: a VPN client is not a place to trade
# debuggability for a smaller binary, and symbols are stripped at bundle
# time anyway.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
