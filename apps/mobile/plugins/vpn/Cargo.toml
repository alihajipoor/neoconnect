[package]
name = "tauri-plugin-neoxify-vpn"
version = "0.1.0"
description = "Android VpnService bridge for the Neoxify client"
edition = "2021"
publish = false
# tauri-plugin's build script requires this, and uses it to key the
# plugin's generated artifacts.
links = "tauri-plugin-neoxify-vpn"

# A plugin crate rather than a module in the app, for one concrete
# reason: Tauri only wires Kotlin into the Gradle build from a plugin's
# `android/` directory. Code dropped into src-tauri/gen/android would be
# lost the next time `tauri android init` regenerates that tree, which is
# also why that tree is gitignored.

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
