[package]
name = "neoxify-helper"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "neoxify-helper"
path = "src/main.rs"

[dependencies]
neoconnect-ipc = { workspace = true }
neoxify-tunnel = { path = "../tunnel" }
neoxify-netguard = { path = "../netguard" }
neoxify-linux-wire = { path = "../wire" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
libc = "0.2"
