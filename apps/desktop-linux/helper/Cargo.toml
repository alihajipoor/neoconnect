[package]
name = "neoxify-helper"
version = "0.2.2"
edition = "2021"
build = "build.rs"

[[bin]]
name = "neoxify-helper"
path = "src/main.rs"

[dependencies]
neoconnect-ipc = { workspace = true }
neoxify-tunnel = { path = "../tunnel" }
neoxify-netguard = { path = "../netguard" }
neoxify-linux-wire = { path = "../wire" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
libc = "0.2"
# The in-app update's signature check: the same verifier Tauri's updater
# uses on Windows, against the same key.
minisign-verify = "0.2"
base64 = "0.22"

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
# Only to make throwaway signatures in the update tests.
ed25519-dalek = "2"
blake2 = "0.10"
