name: CI (iOS)

# Compiles the iOS client. Nothing is published and nothing is signed --
# this exists purely so iOS code has a compiler behind it.
#
# Why a build loop before any Swift is written: the iOS work is authored
# from a Windows machine, and Xcode does not run there. Without this,
# every Swift line would be unverifiable until someone opened the
# project on a Mac, which is exactly how a workflow with three wrong
# paths got written once already. A red build here is the earliest
# honest signal available.
#
# Simulator target on purpose. A device build needs a signing identity
# and an Apple team, neither of which exists yet -- VPN apps require an
# organization enrolment (App Store guideline 5.4) and the company is
# not formed. A simulator build needs no signing and still compiles
# every Swift file, including the Network Extension.
#
# What this therefore does NOT prove, and must never be quoted as
# proving: that the tunnel works. NEPacketTunnelProvider does not run in
# the simulator at all. Only a real iPhone can establish that, and the
# memory ceiling on extensions (~50MB, lower in practice on some
# devices) means the Xray engine in particular has to be proven there
# before anything is built on top of it. "CI is green" means "it
# compiles" and nothing more.
on:
  push:
    # Feature branches too, for the reason ci.yml gives about the desktop
    # service, arrived at from the other direction: iOS cannot be built on
    # this machine either. `gomobile bind -target=ios` and `tauri ios
    # build` both refuse without a full Xcode, and the work machine has
    # Command Line Tools only.
    #
    # With this limited to main, an iOS change could be verified only by
    # merging it -- which for the packet-tunnel work ahead means merging
    # Swift nobody has ever compiled. A macos-latest runner is the only
    # place that can say whether it builds, so branches have to reach it.
    branches: [main, "claude/**", "rig/**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The simulator on Apple-silicon runners. x86_64-apple-ios
          # would be the Intel simulator; aarch64-apple-ios (no -sim) is
          # the device target and is deliberately not built here.
          targets: aarch64-apple-ios-sim

      - run: pnpm install --frozen-lockfile

      # Generated, not committed -- for now.
      #
      # `tauri ios init` only runs on macOS, so it cannot be run from the
      # machine this is authored on. Regenerating each time keeps the
      # repo free of a large Xcode project nobody here can open.
      #
      # This stops working the moment the Network Extension target is
      # added, because that lives in the Xcode project and would be
      # thrown away on every run. At that point gen/apple gets committed
      # -- generated once on the Mac -- and this step becomes a no-op
      # guard instead. Deliberately not pre-empted: committing a
      # generated project before there is anything to customise in it
      # just creates a merge-conflict surface.
      # The Xray engine, built for iOS from the same Go source as the
      # Android AAR. This is the half of the iOS port that needs no new
      # code -- gomobile takes the target as an argument -- so compiling
      # it here proves the engine is portable before any Swift exists to
      # call it. It also needs a full Xcode, which is exactly what a
      # developer machine with only Command Line Tools cannot provide,
      # so CI is the only place it can be checked today.
      # Same pin and the same GOTOOLCHAIN=local as the Android release,
      # and for the same reason: this Go compiles the engine, and an
      # unpinned compiler is a build input that changes without a commit.
      # ci-ios.yml had no setup-go at all, so the engine step failed with
      # exit 127 -- `go` simply was not there.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/mobile/plugins/vpn/xray/go.sum

      - name: Refuse a silent toolchain switch
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Build the Xray engine for iOS
        working-directory: apps/mobile
        run: bash scripts/build-xray-xcframework.sh

      - name: Generate the Xcode project
        if: ${{ hashFiles('apps/mobile/src-tauri/gen/apple/**') == '' }}
        working-directory: apps/mobile
        run: pnpm tauri ios init --ci

      - name: Build for the simulator
        working-directory: apps/mobile
        run: pnpm tauri ios build --target aarch64-sim --debug
