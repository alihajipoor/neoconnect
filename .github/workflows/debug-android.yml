name: Debug Android APK

# An on-demand debug build, for reproducing device-only faults on an
# emulator when no physical phone is reachable.
#
# Exists because the Android client crashes on the Xray protocols and the
# released APK is arm64-only: an arm64 image cannot be emulated usefully
# on an x86_64 host, so diagnosing it locally needs an x86_64 build that
# no release produces. Building here rather than on a workstation because
# this toolchain -- NDK, gomobile, Gradle -- is already proven in
# release-android.yml, and a diagnosis is worth nothing if the build
# itself is a variable.
#
# Builds the RELEASE variant and signs it with a throwaway key generated
# here, rather than `--debug`. Two reasons, one forced and one better:
#
#   - `--debug` does not build. D8 fails to dex
#     com.wireguard.android:tunnel in the debug variant ("Attempt to
#     create a global synthetic for 'Record desugaring' without a
#     global-synthetics consumer") because that variant runs with
#     enableGlobalSynthetics=false.
#   - Reproducing a fault on a debug variant proves less anyway. Debug
#     changes optimisation, assertions and native packaging, so a crash
#     that only shows in release -- or only hides there -- would be
#     invisible. This is the same variant customers run.
#
# The throwaway key is NOT the release keystore, so nothing built here
# can update an installed app or be published. It exists only to satisfy
# Android's "must be signed to install" rule on an emulator.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Android ABI to build"
        required: true
        default: x86_64
        type: choice
        options: [x86_64, aarch64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      # The Rust target name is not the Tauri target name: Tauri says
      # "x86_64"/"aarch64", Rust wants the full triple. Getting this wrong
      # fails late, inside Gradle, with a missing .so rather than an
      # obviously wrong toolchain.
      - name: Work out the Rust target
        id: rust
        run: |
          case "${{ inputs.target }}" in
            x86_64)  echo "triple=x86_64-linux-android"  >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "triple=aarch64-linux-android" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.rust.outputs.triple }}

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-36" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Built for the SAME ABI as the APK. The release script defaults to
      # arm64, and an x86_64 APK carrying an arm64 engine simply has no
      # libgojni.so: the app then dies with UnsatisfiedLinkError on the
      # first Xray connect, which is indistinguishable from a real crash
      # until you look inside the APK.
      - name: Build the Xray engine
        working-directory: apps/mobile
        run: bash scripts/build-xray-aar.sh
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          XRAY_AAR_TARGET: android/${{ inputs.target == 'x86_64' && 'amd64' || 'arm64' }}

      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec tauri android init

      - name: Apply the Neoxify launcher icon
        working-directory: apps/mobile
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Build
        working-directory: apps/mobile
        run: pnpm exec tauri android build --apk --target ${{ inputs.target }}

      - name: Sign with a throwaway key
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore throwaway.jks -alias throwaway             -keyalg RSA -keysize 2048 -validity 30             -storepass throwaway -keypass throwaway             -dname "CN=Neoxify Debug, O=Neoxify, C=US"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          echo "Signing $unsigned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign             --ks throwaway.jks --ks-key-alias throwaway             --ks-pass pass:throwaway --key-pass pass:throwaway             --out "Neoxify-debug-${{ inputs.target }}.apk" "$unsigned"
          rm -f throwaway.jks

      - uses: actions/upload-artifact@v4
        with:
          name: neoxify-debug-${{ inputs.target }}
          path: apps/mobile/Neoxify-debug-${{ inputs.target }}.apk
          retention-days: 7
