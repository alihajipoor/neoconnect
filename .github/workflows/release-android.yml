name: Release Android

# Builds the Android client into one signed APK and publishes it as a
# GitHub Release asset whenever an android-v* tag is pushed.
#
# Its own tag prefix, like desktop-v* and the agent's v*, because the
# three ship on independent schedules and because the API resolves
# "newest release" per prefix -- a desktop release once hijacked the
# agent installer's download URL precisely because they shared one.
#
# The published asset is Neoxify-<version>.apk, and the API's
# /updates/installer/android reads the version out of that filename
# rather than out of the tag. Same reasoning as the desktop path: the
# filename is written by the build from the version compiled in, so it
# cannot disagree with what the app reports about itself.
on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both, because the release now builds both. Without the armv7
          # target installed the build fails at link time with a message
          # about a missing std, which reads like a toolchain fault
          # rather than a missing target.
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-36" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Same guard as the Windows release, and it exists because the
      # unguarded version shipped a real mistake: desktop-v0.9.0 was
      # pushed against a tree still at 0.8.0 and published a 0.8.0
      # installer under a 0.9.0 name. Prose warnings did not prevent it,
      # so the pipeline refuses it instead.
      - name: Check the tag matches the app version
        run: |
          tagged="${GITHUB_REF_NAME#android-v}"
          built=$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")
          if [ "$tagged" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged but the app is built as $built." >&2
            echo "Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, commit, then tag." >&2
            exit 1
          fi
          echo "tag and app agree on $built"

      # Android identifies an app by its signing key. Every update has
      # to be signed with the same one the customer already installed,
      # or the system treats it as an unrelated package and offers no
      # upgrade path -- so an unsigned or differently-signed release is
      # not a lesser release, it is a dead end. Fail loudly rather than
      # publish one.
      - name: Check the signing key is present
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set." >&2
            echo "Without them this would publish an APK nobody can upgrade to." >&2
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # xray-core, compiled to an Android library. Gitignored rather than
      # committed, so this step is not optional: without it Gradle finds
      # no libs/ and the four Xray protocols silently vanish from the
      # build. Several minutes on a cold cache.
      - name: Build the Xray engine
        working-directory: apps/mobile
        run: bash scripts/build-xray-aar.sh
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
          # The script defaults to arm64 alone, deliberately, so a local
          # build stays fast. A release cannot: an APK carrying 32-bit
          # Rust but only 64-bit Xray would install on an older phone and
          # then fail the moment a customer picked a stealth protocol --
          # working WireGuard, dead Xray, and nothing saying why.
          XRAY_AAR_TARGET: android/arm64,android/arm

      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec tauri android init

      # `android init` writes Tauri's own placeholder launcher icons into
      # the generated tree, and that tree is gitignored, so the committed
      # icons under src-tauri/icons never reach the APK on their own.
      # Without this step the release ships with Tauri's logo on the home
      # screen -- which is exactly what android-v0.1.0 did.
      #
      # Must run after init, not before: init would overwrite it.
      - name: Apply the Neoxify launcher icon
        working-directory: apps/mobile
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      # The APK is the DIRECT build: the one the website hands out and the
      # one Iranian customers use, since Play does not serve them. It
      # keeps in-app purchase and voucher redemption, because nobody
      # distributes it but us and no store's rules reach it.
      #
      # armv7 alongside aarch64 because plenty of the handsets this
      # product exists for are 32-bit, and a 64-bit-only build is not
      # merely slower for them -- it does not install.
      - name: Build the direct APK
        working-directory: apps/mobile
        env:
          VITE_DISTRIBUTION: direct
        run: pnpm exec tauri android build --apk --target aarch64 --target armv7

      # Counted here, on dist/, rather than later on the packaged
      # artifact. Tauri embeds the web bundle into the native library
      # compressed, so the marker is not greppable in the APK or the AAB
      # at all -- an earlier version of this check scanned both whole
      # archives and found direct=0 store=0, which says nothing about the
      # flavour. dist/ is also where the original hand measurement was
      # taken ("direct 3-4, store 2, bundle 8K smaller").
      #
      # It has to run between the two builds: the store build overwrites
      # dist/ in place, so after it there is no direct bundle left to
      # compare against.
      - name: Count purchase markers in the direct bundle
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          n=$( { grep -raoE 'plans\.toAddress' dist/ || true; } | wc -l | tr -d '[:space:]' )
          echo "direct bundle markers: $n"
          echo "DIRECT_MARKERS=$n" >> "$GITHUB_ENV"

      - name: Sign the direct APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          # Universal, so one download works on both architectures. The
          # per-ABI splits exist too, but a website download link cannot
          # ask which chip the phone has.
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*-unsigned.apk' | head -1)
          if [ -z "$unsigned" ]; then
            echo "No universal APK was produced -- a per-ABI split would install on only half the devices." >&2
            find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' >&2
            exit 1
          fi
          echo "Signing $unsigned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks keystore.jks \
            --ks-key-alias neoxify \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --out "Neoxify-$version.apk" \
            "$unsigned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "Neoxify-$version.apk"
          rm -f keystore.jks
          sha256sum "Neoxify-$version.apk" > sha256sums.txt

      # The AAB is the STORE build, and it is a different artifact in two
      # ways at once: Play requires an App Bundle rather than an APK for
      # new apps, and Play's rules forbid the in-app selling the direct
      # build carries. So it is built separately with the store flavour
      # rather than repackaged from the same output.
      #
      # Play splits an AAB per ABI on delivery, so including armv7 costs
      # a customer nothing in download size -- only build time here.
      - name: Build the Play AAB
        working-directory: apps/mobile
        env:
          VITE_DISTRIBUTION: store
        run: pnpm exec tauri android build --aab --target aarch64 --target armv7

      - name: Count purchase markers in the store bundle
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          n=$( { grep -raoE 'plans\.toAddress' dist/ || true; } | wc -l | tr -d '[:space:]' )
          echo "store bundle markers: $n"
          echo "STORE_MARKERS=$n" >> "$GITHUB_ENV"

      - name: Sign the Play AAB
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          unsigned=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          if [ -z "$unsigned" ]; then
            echo "No .aab was produced -- Play will not accept an APK for a new app." >&2
            exit 1
          fi
          echo "Signing $unsigned"
          # jarsigner, not apksigner: apksigner signs APKs and refuses a
          # bundle. This is the *upload* key. Play re-signs with the app
          # signing key -- which must be this same key, uploaded at
          # enrolment, or Play-delivered installs and sideloaded ones
          # become different identities that cannot update each other.
          jarsigner -verbose:summary \
            -keystore keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            -signedjar "Neoxify-$version.aab" \
            "$unsigned" neoxify
          jarsigner -verify "Neoxify-$version.aab"
          rm -f keystore.jks
          sha256sum "Neoxify-$version.aab" >> sha256sums.txt

      # A store build that still contains the purchase flow is the
      # failure that gets an app removed, and it would look completely
      # normal until review. Assert it against the artifact rather than
      # trusting the env var was read.
      #
      # Checks the direct APK too, in the opposite direction: if the
      # flavour ever got crossed, the customers who *can* buy in-app
      # would quietly lose the ability, which nothing else would report.
      - name: Check each artifact carries the right flavour
        working-directory: apps/mobile
        run: |
          set -euo pipefail

          # Compares the two counts taken from dist/ between the builds,
          # rather than re-deriving anything from the packaged artifacts.
          # Grepping the APK and the AAB cannot work: Tauri embeds the web
          # bundle into the native library compressed, and a version of
          # this check that scanned both whole archives measured
          # direct=0 store=0 -- no signal at all, in either direction.
          direct_hits="${DIRECT_MARKERS:-0}"
          store_hits="${STORE_MARKERS:-0}"
          echo "purchase-code marker: direct=$direct_hits store=$store_hits"

          # The i18n dictionaries carry the key in both builds, so the
          # store bundle legitimately keeps a couple of copies as
          # translations. Only the differential distinguishes "the screen
          # shipped" from "its translation shipped".
          #
          # Zero on the direct side means the check is broken, not that
          # the build is clean, and it fails here rather than passing.
          # The dangerous outcome is a store bundle full of purchase code
          # waved through by a guard that was silently looking at
          # nothing, which is exactly what happened twice.
          if [ "$direct_hits" -eq 0 ]; then
            echo "::error::No purchase marker in the DIRECT bundle -- this check is broken, not the build. The marker string or the build layout changed." >&2
            exit 1
          fi

          if [ "$store_hits" -ge "$direct_hits" ]; then
            echo "::error::The store bundle carries as much purchase code as the direct one -- the store flavour did not apply." >&2
            exit 1
          fi

      # The tag's own annotation is the human-written changelog -- see the
      # `git tag -a` message. Without passing it, action-gh-release falls
      # back to generate_release_notes alone, which diffs against the most
      # recent tag of ANY prefix: desktop-v0.9.1's notes came out as a
      # comparison against android-v0.2.6, which is meaningless to a
      # customer reading the download page. The generated commit list is
      # still appended underneath.
      - name: Read the tag's message
        id: tagmsg
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "body<<TAGMSG_EOF"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo "TAGMSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/Neoxify-*.apk
            # For uploading to Play Console by hand. Safe to publish
            # beside the APK: the /updates/installer/android matcher is
            # anchored to `.apk$`, so a phone following the download link
            # can never be handed a bundle it cannot install.
            apps/mobile/Neoxify-*.aab
            apps/mobile/sha256sums.txt
          body: ${{ steps.tagmsg.outputs.body }}
          generate_release_notes: true
