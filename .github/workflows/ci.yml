name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript (backend + panel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neoxify
          POSTGRES_PASSWORD: neoxify
          POSTGRES_DB: neoxify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neoxify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neoxify:neoxify@localhost:5432/neoxify?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No `version:` here — pnpm/action-setup reads it from
        # package.json's "packageManager" field, which is the single
        # source of truth (also used by corepack locally). Setting it
        # here too caused a hard version-mismatch error.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neoxify/backend prisma:generate
      - run: pnpm turbo run lint typecheck build test

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum
      - working-directory: agent
        run: go vet ./...
      - working-directory: agent
        run: go build ./...
      - working-directory: agent
        run: go test ./...

  installer-lint:
    name: Shellcheck installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: installer
          # info-level SC1091 ("can't follow $SCRIPT_DIR/lib/x.sh") is
          # expected noise for scripts that source relative paths computed
          # at runtime — real issues are warning severity and above.
          severity: warning
