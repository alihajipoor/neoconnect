name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runnable by hand on any branch. Without this, a change to CI itself
  # could only be tested by merging it to main and hoping -- which is
  # how the desktop job came to sit broken from the day it was added.
  workflow_dispatch:

jobs:
  ts:
    name: TypeScript (backend + panel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neoxify
          POSTGRES_PASSWORD: neoxify
          POSTGRES_DB: neoxify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neoxify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neoxify:neoxify@localhost:5432/neoxify?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No `version:` here — pnpm/action-setup reads it from
        # package.json's "packageManager" field, which is the single
        # source of truth (also used by corepack locally). Setting it
        # here too caused a hard version-mismatch error.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neoxify/backend prisma:generate
      - run: pnpm turbo run lint typecheck build test

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum
      - working-directory: agent
        run: go vet ./...
      - working-directory: agent
        run: go build ./...
      - working-directory: agent
        run: go test ./...

  installer-lint:
    name: Shellcheck installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: installer
          # info-level SC1091 ("can't follow $SCRIPT_DIR/lib/x.sh") is
          # expected noise for scripts that source relative paths computed
          # at runtime — real issues are warning severity and above.
          severity: warning

      # Catches the backend growing an environment variable the
      # installer never creates. That drift is invisible until somebody
      # installs from scratch, which nobody does -- production has been
      # upgraded in place for weeks -- so it would surface months later
      # on a fresh box, for someone with no idea what changed.
      - name: Installer covers every backend env var
        run: bash scripts/check-installer-drift.sh

      # Same class of silence, different pair of files. Shadowsocks and
      # IKEv2 were both live on real nodes while the panel could offer
      # neither, so a plan created there quietly granted a narrower set
      # of protocols than intended -- and an absent checkbox is
      # indistinguishable from a deliberate choice not to offer it.
      - name: Panel offers every protocol the schema has
        run: bash scripts/check-protocol-drift.sh

      # And the same for plan features, which are more exposed to this than
      # protocols are: a capability is granted by ticking a box, so a box
      # that does not exist makes the capability unreachable and the only
      # symptom is a customer quietly not getting something.
      - name: Panel offers every plan feature the schema has
        run: bash scripts/check-feature-drift.sh

      # The same class of silence again, but this one costs a customer their
      # game account rather than a feature. A game routed by destination
      # prefix must have its whole prefix set or none of it: World of
      # Warcraft holds Home and World open at once, so a partial list splits
      # one account across two source addresses at the same instant, which
      # is the account-sharing signature. `prefixComplete` is the gate that
      # forbids that, and it lived in four files as prose with nothing that
      # would go red if one of them changed.
      - name: Destination-routing completeness gate is intact
        run: bash scripts/check-prefix-completeness.sh

      # The other route to the same banned account, and the one this
      # product's own feature opened. Per-game exit selection is keyed on
      # the executable and a game is routinely several of them -- Rust is
      # its EAC wrapper plus RustClient.exe -- so without something
      # holding a game's binaries together, its launcher and its client
      # can land on two exits and the account presents from two source
      # addresses at once. A catalogue row IS that group, and this checks
      # the rule is still enforced in all six places it has to be.
      - name: A game's binaries go to one exit or to none
        run: bash scripts/check-exit-groups.sh

  desktop:
    name: Desktop client tests
    # The only Windows runner here, and the only reason this job exists:
    # the client is Windows-only Rust, and until now CI never compiled a
    # line of it. Its tests had therefore never run anywhere -- not in CI,
    # and not locally either, because linking needs WinDivert and a
    # developer machine without it silently cannot build the test binary.
    #
    # That gap is not theoretical. desktop-v0.9.6 shipped a teardown that
    # killed the tunnel seconds after connecting, because it keyed on a
    # pipe connection closing while the app opens a fresh connection per
    # request. A customer found it. Nothing between the edit and their
    # machine could have.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile so a dependency change refreshes it, and
      # scoped to this workspace -- the desktop crates are their own
      # cargo workspace, rooted at apps/desktop-windows.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-windows/target
          key: desktop-cargo-${{ hashFiles('apps/desktop-windows/Cargo.lock') }}

      # This job could not compile a line of the client without these,
      # and for two separate reasons: windivert-sys links against
      # WinDivert.lib at build time, so even the service's *test* binary
      # fails to link without it, and the Tauri crate's build script
      # refuses to run unless every bundled resource is already on disk.
      #
      # The job spent its whole existence failing here -- on
      # `resource path resources\WinDivert.dll doesn't exist`, before a
      # single test ran. It was added to catch the kind of fault that
      # shipped in 0.9.6 and never once got far enough to catch anything.
      #
      # Running the same script the release does has a second benefit:
      # when it breaks, this finds out on a push rather than on a tag.
      # It has broken before -- a literal tab in a path meant no released
      # installer contained wstunnel for four versions.
      - name: Fetch bundled binaries
        working-directory: apps/desktop-windows
        run: powershell -ExecutionPolicy Bypass -File src-tauri/scripts/fetch-binaries.ps1

      # The one resource that is built rather than downloaded. The
      # installer bundles the helper service beside the app, so the app
      # crate does not compile until it exists.
      - name: Build the helper service into resources
        working-directory: apps/desktop-windows
        run: |
          cargo build -p neoconnect-service
          Copy-Item target/debug/neoconnect-service.exe src-tauri/resources/neoconnect-service.exe

      # Compiles everything, including the code paths tests do not reach.
      # Kept separate from the test step so a build failure and a failing
      # assertion are distinguishable at a glance.
      - name: Check
        working-directory: apps/desktop-windows
        run: cargo check --workspace --all-targets

      - name: Test
        working-directory: apps/desktop-windows
        run: cargo test --workspace
