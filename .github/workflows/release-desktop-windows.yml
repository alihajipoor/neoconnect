name: Release Desktop (Windows)

# Builds the native Windows client into a single setup.exe (NSIS,
# tauri.conf.json's bundle.targets) and publishes it as a GitHub
# Release asset whenever a desktop-v* tag is pushed -- a separate tag
# prefix from the agent's own v* releases (release-agent.yml) since the
# two ship on independent schedules.
#
# The .sig published alongside the installer is what makes in-app
# updating work: the API's /updates endpoint finds the newest
# desktop-v* release, reads that signature, and hands both to the
# client, which refuses any payload the signature does not match. The
# tag prefix is load-bearing for the same reason -- an agent release
# must never be offered to the app as an update.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write
  # For the OIDC token azure/login exchanges for a short-lived Azure
  # credential. Chosen over a client secret so there is no long-lived
  # password in the repository at all.
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    # Signing is skipped, loudly, when the credentials are absent.
    #
    # It has to degrade rather than fail: releases predate the
    # certificate and must keep working if it ever lapses. But a release
    # that quietly ships unsigned is the silent-failure pattern this repo
    # keeps getting bitten by, so the skip announces itself in the log
    # and the verification step below refuses to pass a build that was
    # supposed to be signed and is not.
    env:
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      # The tag names the version the API will offer; tauri.conf.json
      # names the version the built app reports about itself. If they
      # disagree the updater loops forever -- it installs the "new"
      # build, the app still reports the old number, and the same update
      # is offered again on every launch.
      #
      # This is not hypothetical. desktop-v0.9.0 was pushed against a
      # tree still at 0.8.0 and published exactly that: a 0.8.0
      # installer under a 0.9.0 tag. Warning about it in prose did not
      # prevent it, so the pipeline refuses it instead.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#desktop-v}"
          built=$(node -p "require('./apps/desktop-windows/src-tauri/tauri.conf.json').version")
          if [ "$tagged" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged but the app is built as $built." >&2
            echo "Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json, commit, then tag." >&2
            exit 1
          fi
          echo "tag and app agree on $built"

      # Fetches the real, official wireguard.exe/wg.exe (see
      # src-tauri/scripts/fetch-binaries.ps1 and resources/README.md) --
      # gitignored, never vendored in git, must exist on disk before
      # `tauri build` bundles them into the installer.
      - name: Fetch WireGuard binaries
        working-directory: apps/desktop-windows
        run: pnpm run fetch-binaries

      # No code-signing certificate exists yet (a real purchase/business
      # decision, tracked separately in the M15 plan entry) -- this
      # installer is unsigned for now, which means Windows SmartScreen
      # will warn on first run. Once a certificate exists, sign here
      # (e.g. via a signtool step against the built .exe, or Tauri's
      # own WINDOWS_CERTIFICATE/WINDOWS_CERTIFICATE_PASSWORD env vars)
      # before the release step below.
      #
      # Note this is a different concern from the updater signing below,
      # and neither covers the other: Authenticode proves the publisher
      # to Windows and SmartScreen, while the updater key proves to an
      # already-installed app that a payload came from this pipeline.
      # ---------------------------------------------------------------
      # TAURI_SIGNING_PRIVATE_KEY signs the updater artifact. Without
      # it the build still succeeds but produces no .sig, and the API's
      # update endpoint finds nothing to offer -- a silent no-updates
      # state rather than a failure, so the secret's absence is checked
      # explicitly here instead of being discovered weeks later.
      - name: Check updater signing key is present
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set -- the release would ship without an updater signature." >&2
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # The published endpoint list, baked into the binary. A fresh
      # install has no cached bundle and every compiled-in base is on a
      # domain censored in Iran, so without this the installer cannot
      # reach the service at all on the networks it is built for.
      # Required, not best-effort: a silent fallback would ship that
      # failure looking entirely healthy.
      # Two things, both from the published bundle and neither committed
      # (docs/node-address-hygiene.md): the seed baked into the binary,
      # and the auto-updater's own endpoint list. The updater keeps a
      # separate list from the API bases, and it was left entirely on the
      # censored domain -- so a blocked customer was never offered an
      # update, which is the one channel that would have carried the fix.
      - name: Fetch endpoint seed bundle and updater endpoints
        working-directory: apps/desktop-windows
        run: pnpm run seed
        env:
          NEOXIFY_REQUIRE_SEED: "1"

      - name: Build
        working-directory: apps/desktop-windows
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Authenticode, so Windows names a real publisher instead of
      # "Unknown". Distinct from the updater signature above: that one
      # proves a payload came from this pipeline, this one proves who
      # published it. Two keys, two purposes, neither substitutes.
      - name: Announce that signing is skipped
        if: env.SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          echo "::warning title=Unsigned release::AZURE_CLIENT_ID is not set, so this build is NOT Authenticode-signed. Windows will warn about an unknown publisher."

      - name: Azure login
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only the NSIS installer exists at this point. The bootstrapper is
      # built afterwards, deliberately, because it embeds this file --
      # signing it later would leave a signed wrapper around an unsigned
      # payload.
      - name: Sign the installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: apps/desktop-windows/target/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          # Not on by default, and without it the signature is only
          # valid for three days -- after which every installer already
          # in the wild would start warning again. A timestamp
          # countersignature keeps shipped builds trusted even once the
          # certificate expires or is replaced, which it will be: since
          # March 2026 these certificates max out at 460 days.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Signing rewrote the installer, so the updater signature produced
      # during the build no longer matches it.
      #
      # This is the step whose absence would break updating for every
      # existing customer: the client refuses any payload whose Ed25519
      # signature does not verify, so a stale .sig means the update
      # downloads and is then rejected, forever, with no way to fix it
      # from the server side. Regenerate over the signed bytes.
      - name: Re-sign the updater payload
        if: env.SIGNING_ENABLED == 'true'
        working-directory: apps/desktop-windows
        shell: bash
        run: |
          installer=$(ls target/release/bundle/nsis/*_x64-setup.exe | head -1)
          echo "Regenerating the updater signature over $installer"
          pnpm exec tauri signer sign "$installer"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The branded single-click installer the website hands out. It
      # carries the NSIS installer above inside itself, so NEOXIFY_SETUP
      # has to point at an already-built one -- hence this step running
      # after the build rather than as part of it.
      #
      # Both artifacts ship. This one is for a human downloading the app
      # for the first time; the raw NSIS installer beside it is what the
      # in-app updater consumes, where the welcome screen would only be
      # something to click through.
      - name: Build branded bootstrapper
        working-directory: apps/desktop-windows
        shell: bash
        run: |
          # Absolute, because build.rs resolves NEOXIFY_SETUP relative to
          # the bootstrapper crate directory rather than the workspace
          # root -- a relative path here looks for
          # bootstrapper/target/... and is not there.
          setup=$(ls "$PWD"/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          echo "Embedding $setup"
          # Static CRT, and this is not a nicety. A Rust MSVC binary links
          # VCRUNTIME140.dll dynamically by default, and that DLL is not
          # part of Windows -- it arrives with the Visual C++
          # redistributable, which a clean install does not have. Every
          # other binary here is installed *by* this one and can rely on
          # what the installer puts down; this one runs before any of
          # that exists. Built dynamically it dies on launch with "the
          # code execution cannot proceed because VCRUNTIME140.dll was
          # not found", which is what a customer sees instead of the app.
          #
          # Verified on a clean Windows 11 VM with no redistributable:
          # the dynamic build showed exactly that dialog and, under /S,
          # hung forever waiting for someone to click OK.
          #
          # Scoped to this one crate rather than .cargo/config.toml,
          # which would apply to the whole workspace and change how the
          # Tauri app and the service link too.
          NEOXIFY_SETUP="$setup" RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release -p neoxify-bootstrapper
          # The crate is neoxify-bootstrapper but its [[bin]] name is
          # Neoxify-Setup, so that -- not the crate name -- is what
          # cargo writes.
          cp target/release/Neoxify-Setup.exe target/release/bundle/nsis/Neoxify-Setup.exe

      # apps/desktop-windows/Cargo.toml is the cargo workspace root
      # (members: src-tauri, service, ipc, bootstrapper), so the target
      # directory is there rather than under src-tauri/. These paths
      # used to say src-tauri/target and matched nothing -- which no
      # one noticed because no desktop-v* tag had ever been pushed, so
      # this workflow had never actually run.
      # The bootstrapper is a fresh binary built after the signing step
      # above, so it is unsigned until now -- and it is the one most
      # customers actually download from the website.
      - name: Sign the bootstrapper
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          # Absolute, which this input requires -- a relative path here
          # matches nothing. Named explicitly rather than re-running
          # files-folder over the whole directory, because re-signing
          # the NSIS installer a second time would rewrite its bytes and
          # invalidate the updater signature regenerated above.
          files: ${{ github.workspace }}\apps\desktop-windows\target\release\bundle\nsis\Neoxify-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing step that quietly does nothing is the failure mode
      # worth guarding against: everything stays green and the release
      # ships unsigned. Assert against the files themselves rather than
      # trusting the steps above reported success.
      #
      # Timestamp presence is checked too, because a signature without
      # one expires in three days and would take every already-installed
      # copy's trust with it.
      - name: Verify both binaries are signed and timestamped
        if: env.SIGNING_ENABLED == 'true'
        working-directory: apps/desktop-windows/target/release/bundle/nsis
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($f.Name) is not validly signed: $($sig.Status)"
              $failed = $true
              continue
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              Write-Host "::error::$($f.Name) is signed but NOT timestamped -- the signature would expire in days."
              $failed = $true
              continue
            }
            Write-Host "$($f.Name): signed by $($sig.SignerCertificate.Subject), timestamped"
          }
          if ($failed) { exit 1 }

      - name: Generate checksum
        working-directory: apps/desktop-windows/target/release/bundle/nsis
        shell: bash
        run: sha256sum *.exe > sha256sums.txt

      # The tag's own annotation is the human-written changelog -- see the
      # `git tag -a` message. Without passing it, action-gh-release falls
      # back to generate_release_notes alone, which diffs against the most
      # recent tag of ANY prefix: desktop-v0.9.1's notes came out as a
      # comparison against android-v0.2.6, which is meaningless to a
      # customer reading the download page. The generated commit list is
      # still appended underneath.
      - name: Read the tag's message
        id: tagmsg
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "body<<TAGMSG_EOF"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo "TAGMSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop-windows/target/release/bundle/nsis/*.exe
            apps/desktop-windows/target/release/bundle/nsis/*.sig
            apps/desktop-windows/target/release/bundle/nsis/sha256sums.txt
          body: ${{ steps.tagmsg.outputs.body }}
          generate_release_notes: true
