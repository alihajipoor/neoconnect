syntax = "proto3";

package neoxify.agent.v1;

option go_package = "github.com/neoxify/neoxify-hub/agent/internal/controlplane/pb";

// AgentSync is the single long-lived bidirectional stream an agent opens.
// The TCP connection is always initiated by the agent (never the control
// plane), so relay/exit nodes never need an inbound firewall hole; once
// open, messages flow both directions on the same stream. See
// docs/architecture.md for the full enrollment and reconciliation flow.
//
// Enrollment happens over plain HTTPS (POST /enrollment/claim) before this
// stream is ever opened -- that's where the agent trades a one-time admin-
// issued token for its identity being recorded against a Node row. This
// stream is purely for the ongoing authenticated channel once claimed.
service AgentGateway {
  rpc AgentSync(stream AgentMessage) returns (stream ControlMessage);
}

// ---- Agent -> Control plane ----

message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    StatsBatch stats_batch = 3;
    CommandAck command_ack = 4;
    StateSnapshot state_snapshot = 5;
  }
}

// Hello must be the first message on every stream. Authentication is a
// self-signed, timestamped assertion rather than an interactive
// challenge-response: the agent signs node_id+timestamp+nonce with the
// Ed25519 private key it generated at enroll time, and the control plane
// verifies the signature against the public key it stored for that node
// during /enrollment/claim. The timestamp bounds replay -- the server
// rejects Hellos outside a small freshness window (see agent-gateway
// module) -- trading a round trip for simplicity, acceptable since this
// only authenticates the transport, not individual privileged actions.
message Hello {
  string node_id = 1;
  int64 timestamp = 2;   // unix seconds when signed
  string nonce = 3;      // random per-connection, included in the signed payload
  bytes signature = 4;   // Ed25519 signature over `${node_id}.${timestamp}.${nonce}`
  string agent_version = 5;
}

message Heartbeat {
  double cpu_percent = 1;
  double mem_percent = 2;
  int32 active_connections = 3;
}

message StatsBatch {
  repeated UsageDelta deltas = 1;
}

message UsageDelta {
  string external_user_id = 1;
  string protocol = 2;
  uint64 bytes_up = 3;
  uint64 bytes_down = 4;
}

message CommandAck {
  string command_id = 1;
  bool success = 2;
  string error = 3;
}

message StateSnapshot {
  repeated ProtocolUserRef users = 1;
}

message ProtocolUserRef {
  string external_user_id = 1;
  string protocol = 2;
  int64 version = 3;
}

// ---- Control plane -> Agent ----

message ControlMessage {
  oneof payload {
    Command command = 1;
  }
}

message Command {
  string id = 1;
  CommandType type = 2;
  bytes payload_json = 3;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  CREATE_USER = 1;
  UPDATE_USER = 2;
  DELETE_USER = 3;
  DISABLE_USER = 4;
  ENABLE_USER = 5;
  SET_QUOTA = 6;
  SYNC = 7;
}
