syntax = "proto3";

package neoxify.agent.v1;

option go_package = "github.com/neoxify/neoxify-hub/agent/internal/controlplane/pb";

// AgentSync is the single long-lived bidirectional stream an agent opens.
// The TCP connection is always initiated by the agent (never the control
// plane), so relay/exit nodes never need an inbound firewall hole; once
// open, messages flow both directions on the same stream. See
// docs/architecture.md for the full enrollment and reconciliation flow.
//
// Enrollment happens over plain HTTPS (POST /enrollment/claim) before this
// stream is ever opened -- that's where the agent trades a one-time admin-
// issued token for its identity being recorded against a Node row. This
// stream is purely for the ongoing authenticated channel once claimed.
service AgentGateway {
  rpc AgentSync(stream AgentMessage) returns (stream ControlMessage);
}

// ---- Agent -> Control plane ----

message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    StatsBatch stats_batch = 3;
    CommandAck command_ack = 4;
    StateSnapshot state_snapshot = 5;
  }
}

// Hello must be the first message on every stream. Authentication is a
// self-signed, timestamped assertion rather than an interactive
// challenge-response: the agent signs node_id+timestamp+nonce with the
// Ed25519 private key it generated at enroll time, and the control plane
// verifies the signature against the public key it stored for that node
// during /enrollment/claim. The timestamp bounds replay -- the server
// rejects Hellos outside a small freshness window (see agent-gateway
// module) -- trading a round trip for simplicity, acceptable since this
// only authenticates the transport, not individual privileged actions.
message Hello {
  string node_id = 1;
  int64 timestamp = 2;   // unix seconds when signed
  string nonce = 3;      // random per-connection, included in the signed payload
  bytes signature = 4;   // Ed25519 signature over `${node_id}.${timestamp}.${nonce}`
  string agent_version = 5;
}

message Heartbeat {
  double cpu_percent = 1;
  double mem_percent = 2;
  int32 active_connections = 3;

  // REALITY camouflage-destination health, measured FROM THIS NODE.
  //
  // REALITY forwards every client handshake to its `dest`, so a dest the
  // node cannot complete TLS with turns that node into one which accepts
  // connections and serves nothing: the TCP handshake succeeds because
  // Xray accepts it, and everything above dies waiting on a forward that
  // never returns. finland1 was in exactly that state until 2026-08-31,
  // its dest (www.shatel.ir) unreachable from Finland, while the panel
  // reported it ONLINE the whole time -- because the heartbeat had no
  // opinion about REALITY.
  //
  // It has to be measured on the node rather than by the panel:
  // reachability is a property of the node-dest PAIR, not of the dest.
  // www.shatel.ir is dead from Finland and fine from Germany.
  //
  // `reality_dest` is empty on a node with no REALITY inbound, and on any
  // agent older than v0.2.8 -- which is why `reality_dest_reachable`
  // must never be read without checking `reality_dest` first. A missing
  // field is "did not say", not "unreachable".
  string reality_dest = 4;
  bool reality_dest_reachable = 5;
}

message StatsBatch {
  repeated UsageDelta deltas = 1;
  // How many distinct client addresses each user is currently active
  // from. Rides along with usage rather than getting its own message
  // because it comes from the same poll and is only meaningful next to
  // it. Empty for protocols that can't report it -- see SessionCount.
  repeated SessionCount sessions = 2;
}

// Concurrency for one provisioned user, measured as distinct source
// addresses seen recently.
//
// Only Xray reports this, and only Xray needs to. VLESS accepts
// unlimited concurrent connections for the same UUID, so a shared
// credential really does multiply into many simultaneous users. The
// other two engines are already self-limiting: OpenVPN replaces an
// existing session when the same certificate connects again (no
// duplicate-cn), and a WireGuard peer tracks a single endpoint, so
// devices sharing a key fight over it rather than working in parallel.
message SessionCount {
  string external_user_id = 1;
  string protocol = 2;
  // Distinct source addresses within the reporting window. A user
  // roaming between networks briefly shows two, which is why the server
  // requires this to persist before acting on it.
  uint32 distinct_sources = 3;
  // The addresses behind that count, most recently seen first, at most 8.
  //
  // For the connection log's "From address". An app reports a successful
  // connect through the tunnel it has just opened, so the backend sees
  // one of our own servers as the sender and nothing of the customer;
  // the node is the one place that saw where the customer really came
  // from. Sent by the node rather than the app because every app version
  // already in customers' hands then gets it too.
  //
  // The backend holds these in memory only long enough to match them to
  // that report: the one that matches is written into that report's row,
  // and the list itself is never kept as a history of where anyone has
  // been. The count above is still what the device limit acts on: this
  // list is capped and normalised, so its length is not a count and must
  // never be read as one. Empty from any agent older than this field.
  repeated SourceAddress sources = 4;
}

// One place a user is connected from, as the node's engine saw it.
message SourceAddress {
  // A bare IP in canonical form: no port, IPv6 without brackets.
  string address = 1;
  // How long before this report the engine last saw the address,
  // measured on the node's own clock. Relative rather than a timestamp so
  // a node whose clock has drifted cannot place a sighting at the wrong
  // moment on the backend's. 0 from an engine that only knows "connected
  // now".
  uint32 seconds_ago = 2;
}

message UsageDelta {
  string external_user_id = 1;
  string protocol = 2;
  uint64 bytes_up = 3;
  uint64 bytes_down = 4;
}

message CommandAck {
  string command_id = 1;
  bool success = 2;
  string error = 3;
}

message StateSnapshot {
  repeated ProtocolUserRef users = 1;
}

message ProtocolUserRef {
  string external_user_id = 1;
  string protocol = 2;
  int64 version = 3;
}

// ---- Control plane -> Agent ----

message ControlMessage {
  oneof payload {
    Command command = 1;
  }
}

message Command {
  string id = 1;
  CommandType type = 2;
  bytes payload_json = 3;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  CREATE_USER = 1;
  UPDATE_USER = 2;
  DELETE_USER = 3;
  DISABLE_USER = 4;
  ENABLE_USER = 5;
  SET_QUOTA = 6;
  SYNC = 7;
  // Hot-wires a relay node's local Xray process to forward one Route's
  // traffic to its exit (AddOutbound + AddRule), or a WireGuard/OpenVPN
  // subnet through the tun bridge -- see "Multi-Hop Relay Chaining" in
  // the architecture plan. Targets the relay node, not an end customer.
  CONFIGURE_ROUTE = 8;
  REMOVE_ROUTE = 9;
}
