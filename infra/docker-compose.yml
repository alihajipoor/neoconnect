name: neoxify-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neoxify
      POSTGRES_PASSWORD: neoxify
      POSTGRES_DB: neoxify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoxify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local-dev-only fake SMTP server for M16's email notifications --
  # accepts any mail on 1025 (no real auth check) and shows what arrived
  # at http://localhost:8025, so email triggers can be proven against a
  # real inbox instead of just "no error was thrown". Never used in
  # production (see infra/docker-compose.prod.yml, which has no mailhog
  # service -- production points EMAIL_SETTINGS at a real SMTP server via
  # the panel's Settings page).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
