name: neoxify

# Production stack for the main panel server. Postgres/Redis are not
# published to the host at all (backend reaches them over the internal
# compose network only); backend/panel are published to 127.0.0.1 only —
# host nginx (installed separately, see installer/lib/panel.sh) is the
# only thing exposed publicly, terminating TLS and reverse-proxying in.
#
# Run from the repo root: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neoxify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: neoxify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoxify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://neoxify:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/neoxify?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CUSTOMER_JWT_ACCESS_SECRET: ${CUSTOMER_JWT_ACCESS_SECRET:?CUSTOMER_JWT_ACCESS_SECRET is required}
      CUSTOMER_JWT_REFRESH_SECRET: ${CUSTOMER_JWT_REFRESH_SECRET:?CUSTOMER_JWT_REFRESH_SECRET is required}
      CUSTOMER_JWT_ACCESS_TTL: ${CUSTOMER_JWT_ACCESS_TTL:-15m}
      CUSTOMER_JWT_REFRESH_TTL: ${CUSTOMER_JWT_REFRESH_TTL:-7d}
      # Agent gRPC gateway TLS: uses a copy of the same Let's Encrypt cert
      # nginx manages for the panel domain, not the original -- certbot
      # locks privkey.pem to root-only (0600), unreadable by this
      # container's non-root user, so installer/lib/panel.sh copies both
      # files into /etc/neoxify/certs (0644, fine since only the VPS's own
      # root has shell access anyway) and re-copies on every renewal via a
      # certbot deploy-hook. Unlike the HTTP API, agent traffic is NOT
      # proxied through nginx -- see docs/architecture.md -- so it's
      # published directly and needs its own TLS termination.
      AGENT_TLS_CERT_PATH: /etc/neoxify/certs/fullchain.pem
      AGENT_TLS_KEY_PATH: /etc/neoxify/certs/privkey.pem
      # Billing: were read via ConfigService since M7 but never actually
      # passed through here -- real gap, caught during the M11 hardening
      # pass, not by anything failing loudly (billing endpoints just
      # silently ran with everything undefined).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PLISIO_API_KEY: ${PLISIO_API_KEY:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY is required}
      # Optional, unlike the line above: absent, the backend derives one
      # from CREDENTIALS_ENCRYPTION_KEY, and absent both it simply mints
      # no exit handles and clients offer no per-game exit picker. A
      # required-variable guard here would take the whole stack down over
      # a feature that degrades cleanly.
      EXIT_HANDLE_SECRET: ${EXIT_HANDLE_SECRET:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Lifts the GitHub API limit on the release lookups behind
      # /api/updates from 60 requests an hour per IP to 5,000. Optional:
      # unset, the lookups are made anonymously and still work.
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      # Iran reachability probing. All optional -- every one has a
      # working default in the code, and the feature is on without any
      # of them being set. Declared here rather than left implicit so
      # they can be tuned on a running panel without a rebuild, and so
      # that a fresh install knows they exist.
      #
      # REACHABILITY_COUNTRY is deliberately absent: it has a string
      # default in configuration.ts, so it needs nothing from here.
      REACHABILITY_ENABLED: ${REACHABILITY_ENABLED:-}
      REACHABILITY_PORT: ${REACHABILITY_PORT:-}
      REACHABILITY_FAILURES_BEFORE_ALERT: ${REACHABILITY_FAILURES_BEFORE_ALERT:-}
      REACHABILITY_RETENTION_DAYS: ${REACHABILITY_RETENTION_DAYS:-}
      # Unset, every SUPERADMIN in admin_users is mailed, which is the
      # right default because it needs no maintenance.
      REACHABILITY_ALERT_EMAILS: ${REACHABILITY_ALERT_EMAILS:-}
      # Per-ISP recommendations: an offline IP-to-ASN table (iptoasn.com,
      # public domain), downloaded once a day. All optional and on by
      # default. ASN_LOOKUP_ENABLED=false turns the feature off (no tags,
      # nothing else changes); ASN_DATASET_URL=none skips the download and
      # uses only the file at ASN_DATASET_PATH, which defaults to the
      # container's temp directory -- fetched again after a restart.
      ASN_LOOKUP_ENABLED: ${ASN_LOOKUP_ENABLED:-}
      ASN_DATASET_URL: ${ASN_DATASET_URL:-}
      ASN_DATASET_PATH: ${ASN_DATASET_PATH:-}
      # Shared secret machine callers present as X-Service-Token. Must reach
      # the backend as well as the bot: the guard fails closed, so with this
      # set only on the bot side every request is rejected with a 401.
      INTEGRATIONS_SERVICE_TOKEN: ${INTEGRATIONS_SERVICE_TOKEN:-}
      # Public address of this API, used to build links inside emails.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # Signing in with Google, Apple and Facebook.
      #
      # Enumerated here, like everything else in this block, because a
      # value in infra/.env reaches Compose's interpolation and NOT the
      # container -- the same gap the billing keys above sat in until the
      # M11 pass. It had already happened again here: all five were set
      # in .env and none was passed through, so every provider button
      # would have answered "not available right now" with only a log
      # line to say why.
      #
      # Each defaults to empty rather than being required. A provider
      # with no credentials refuses that one sign-in and leaves the
      # others and password login working, which is the behaviour a
      # half-configured deployment should have.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # The bundle identifier, not a client id -- the native sheet has no
      # client secret. Comma separated, for a future macOS or web client.
      APPLE_SIGNIN_AUDIENCES: ${APPLE_SIGNIN_AUDIENCES:-}
      # Recent failures tolerated before a sign-in must carry a solved
      # proof-of-work challenge. Unset = 5. Set to 0 to require one on
      # every attempt -- but ONLY once every customer is on a client
      # that can solve one, which no released build can yet. See
      # modules/login-guard/login-guard.service.ts.
      LOGIN_CHALLENGE_GRACE_FAILURES: ${LOGIN_CHALLENGE_GRACE_FAILURES:-}
      # Per-device VPN credentials and the plan's device limit
      # (docs/per-device-credentials.md, docs/device-slots.md). All
      # optional: empty means the default in the code, and a change takes
      # effect when `docker compose up -d` recreates this container.
      #
      # Hidden safety cap on how many of one customer's signed-in devices
      # hold VPN credentials of their own (default 10, at most 50). Not
      # the plan's device limit. Each one is a WireGuard peer out of a /24.
      CUSTOMER_DEVICE_CREDENTIAL_LIMIT: ${CUSTOMER_DEVICE_CREDENTIAL_LIMIT:-}
      # The node-side backstop for the plan's device limit: "shadow"
      # (default) works out which device it would hold and only logs it;
      # "enforce" holds it. Leave it at shadow until a week of logs shows
      # no "would hold" against a device holding a slot.
      CONCURRENCY_CUT: ${CONCURRENCY_CUT:-}
      # Swagger UI at /api/docs. Off here because NODE_ENV is production;
      # set to "true" only if you deliberately want the whole control
      # plane's routes and payload shapes published unauthenticated.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
    volumes:
      - /etc/neoxify/certs:/etc/neoxify/certs:ro
    ports:
      - "127.0.0.1:4000:4000"
      - "50051:50051"

  panel:
    build:
      context: ..
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side only (never sent to the browser): the panel's Next.js
      # server calls the backend directly over the internal compose
      # network, same as nginx would, but without the extra hop.
      INTERNAL_API_URL: http://backend:4000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"

  # Optional. Only starts under `--profile discord`, so a deployment that has
  # no Discord server is unaffected by its presence here.
  discord-bot:
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: apps/discord-bot/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Defaulted to empty so compose does not warn on every deployment that
      # never enables this profile. The bot validates them at boot and exits
      # if one is missing, which is the honest place to fail.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Reaches the backend over the internal compose network, so the bot's
      # service token never crosses the public internet.
      NEOXIFY_API_URL: http://backend:4000
      INTEGRATIONS_SERVICE_TOKEN: ${INTEGRATIONS_SERVICE_TOKEN:-}
      NEOXIFY_WEBSITE_URL: ${NEOXIFY_WEBSITE_URL:-https://neoxify.net}
      NODE_ENV: production
    # No ports: the bot dials out to Discord and accepts nothing inbound.

volumes:
  postgres-data:
  redis-data:
