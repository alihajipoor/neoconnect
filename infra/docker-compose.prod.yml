name: neoxify

# Production stack for the main panel server. Postgres/Redis are not
# published to the host at all (backend reaches them over the internal
# compose network only); backend/panel are published to 127.0.0.1 only —
# host nginx (installed separately, see installer/lib/panel.sh) is the
# only thing exposed publicly, terminating TLS and reverse-proxying in.
#
# Run from the repo root: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neoxify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: neoxify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoxify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://neoxify:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/neoxify?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CUSTOMER_JWT_ACCESS_SECRET: ${CUSTOMER_JWT_ACCESS_SECRET:?CUSTOMER_JWT_ACCESS_SECRET is required}
      CUSTOMER_JWT_REFRESH_SECRET: ${CUSTOMER_JWT_REFRESH_SECRET:?CUSTOMER_JWT_REFRESH_SECRET is required}
      CUSTOMER_JWT_ACCESS_TTL: ${CUSTOMER_JWT_ACCESS_TTL:-15m}
      CUSTOMER_JWT_REFRESH_TTL: ${CUSTOMER_JWT_REFRESH_TTL:-7d}
      # Agent gRPC gateway TLS: uses a copy of the same Let's Encrypt cert
      # nginx manages for the panel domain, not the original -- certbot
      # locks privkey.pem to root-only (0600), unreadable by this
      # container's non-root user, so installer/lib/panel.sh copies both
      # files into /etc/neoxify/certs (0644, fine since only the VPS's own
      # root has shell access anyway) and re-copies on every renewal via a
      # certbot deploy-hook. Unlike the HTTP API, agent traffic is NOT
      # proxied through nginx -- see docs/architecture.md -- so it's
      # published directly and needs its own TLS termination.
      AGENT_TLS_CERT_PATH: /etc/neoxify/certs/fullchain.pem
      AGENT_TLS_KEY_PATH: /etc/neoxify/certs/privkey.pem
      # Billing: were read via ConfigService since M7 but never actually
      # passed through here -- real gap, caught during the M11 hardening
      # pass, not by anything failing loudly (billing endpoints just
      # silently ran with everything undefined).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PLISIO_API_KEY: ${PLISIO_API_KEY:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY is required}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Shared secret machine callers present as X-Service-Token. Must reach
      # the backend as well as the bot: the guard fails closed, so with this
      # set only on the bot side every request is rejected with a 401.
      INTEGRATIONS_SERVICE_TOKEN: ${INTEGRATIONS_SERVICE_TOKEN:-}
      # Public address of this API, used to build links inside emails.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # Recent failures tolerated before a sign-in must carry a solved
      # proof-of-work challenge. Unset = 5. Set to 0 to require one on
      # every attempt -- but ONLY once every customer is on a client
      # that can solve one, which no released build can yet. See
      # modules/login-guard/login-guard.service.ts.
      LOGIN_CHALLENGE_GRACE_FAILURES: ${LOGIN_CHALLENGE_GRACE_FAILURES:-}
      # Swagger UI at /api/docs. Off here because NODE_ENV is production;
      # set to "true" only if you deliberately want the whole control
      # plane's routes and payload shapes published unauthenticated.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
    volumes:
      - /etc/neoxify/certs:/etc/neoxify/certs:ro
    ports:
      - "127.0.0.1:4000:4000"
      - "50051:50051"

  panel:
    build:
      context: ..
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side only (never sent to the browser): the panel's Next.js
      # server calls the backend directly over the internal compose
      # network, same as nginx would, but without the extra hop.
      INTERNAL_API_URL: http://backend:4000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"

  # Optional. Only starts under `--profile discord`, so a deployment that has
  # no Discord server is unaffected by its presence here.
  discord-bot:
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: apps/discord-bot/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Defaulted to empty so compose does not warn on every deployment that
      # never enables this profile. The bot validates them at boot and exits
      # if one is missing, which is the honest place to fail.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Reaches the backend over the internal compose network, so the bot's
      # service token never crosses the public internet.
      NEOXIFY_API_URL: http://backend:4000
      INTEGRATIONS_SERVICE_TOKEN: ${INTEGRATIONS_SERVICE_TOKEN:-}
      NEOXIFY_WEBSITE_URL: ${NEOXIFY_WEBSITE_URL:-https://neoxify.net}
      NODE_ENV: production
    # No ports: the bot dials out to Discord and accepts nothing inbound.

volumes:
  postgres-data:
  redis-data:
